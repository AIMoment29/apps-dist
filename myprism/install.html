<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安装 MyPrism</title>
<style>
  :root{--bg:#f7f4ec;--card:#fff;--label:#1a1a1a;--label2:#6b655c;--accent:#8a5a2b;--sep:#e4ded2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--label);
    font-family:-apple-system,"SF Pro Text",system-ui,"PingFang SC",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px}
  .card{width:100%;max-width:420px;background:var(--card);border-radius:22px;
    padding:30px 24px 26px;text-align:center;border:1px solid var(--sep);
    box-shadow:0 20px 50px -24px rgba(0,0,0,.18)}
  .icon{width:82px;height:82px;border-radius:19px;margin:0 auto 16px;
    background:linear-gradient(160deg,#c97b4a,#8a5a2b);display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}
  h1{font-size:22px;margin:0 0 4px}
  .ver{color:var(--label2);font-size:14px;margin-bottom:22px}
  .btn{display:block;background:var(--accent);color:#fff;text-decoration:none;
    border-radius:14px;padding:15px 0;font-size:17px;font-weight:600}
  .tips{text-align:left;color:var(--label2);font-size:13px;line-height:1.75;
    margin-top:22px;border-top:1px solid var(--sep);padding-top:16px}
  .tips b{color:var(--label)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">MP</div>
  <h1>MyPrism</h1>
  <div class="ver">当前版本 <b>1.0.0+12</b></div>
  <a class="btn" href="itms-services://?action=download-manifest&amp;url=https://aimoment29.github.io/apps-dist/myprism/manifest.plist">安装</a>
  <div class="tips">
    1. 必须在 <b>Safari</b> 打开本页<br>
    2. 点「安装」后回桌面等待安装完成<br>
    3. 无法打开时，在“VPN 与设备管理”中信任开发者证书<br>
    4. 只有已登记 UDID 的设备可以安装此 Ad Hoc 版本
  </div>
</div>
</body>
</html>
